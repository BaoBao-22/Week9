name: Java CI with Maven Matrix Strategy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test Bai9.5 with JaCoCo
      run: mvn -B clean verify --file Bai9.5/pom.xml

    - name: Upload JaCoCo Coverage Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: jacoco-report-${{ matrix.os }}
        path: Bai9.5/target/site/jacoco/
