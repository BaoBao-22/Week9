name: Java CI with Maven Matrix Strategy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test Bai9.4 with Maven
      run: mvn -B package --file Bai9.4/pom.xml

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v3
      if: matrix.os == 'ubuntu-latest' # Only upload from one OS to save space
      with:
        name: bank-system-matrix-jar
        path: Bai9.4/target/*.jar
